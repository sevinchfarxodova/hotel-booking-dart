openapi: 3.0.3
info:
  title: Hotel Booking API
  version: 0.8.0
paths:
  /rooms/available:
    get:
      summary: Search available rooms for a date range
      parameters:
        - name: checkIn
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: checkOut
          in: query
          required: true
          schema:
            type: string
            format: date
      responses:
        '200':
          description: List of available rooms
  /reservations:
    post:
      summary: Create a new reservation
      responses:
        '201':
          description: Reservation confirmed
        '409':
          description: Room already booked for overlapping dates
  /reservations/{id}:
    delete:
      summary: Cancel an existing reservation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Reservation cancelled
        '404':
          description: Reservation not found
  /stats:
    get:
      summary: Runtime counters for searches, database queries, and cache hits/misses
      responses:
        '200':
          description: Current in-memory counters
          content:
            application/json:
              schema:
                type: object
                required: [searches, databaseQueries, cacheHits, cacheMisses]
                properties:
                  searches:
                    type: integer
                  databaseQueries:
                    type: integer
                  cacheHits:
                    type: integer
                  cacheMisses:
                    type: integer
