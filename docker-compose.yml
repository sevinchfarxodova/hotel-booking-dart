# Start with: docker compose up -d. Stop without removing the hotel-data volume: docker compose down.
services:
  db:
    image: postgres:18
    environment:
      POSTGRES_DB: hotel
      POSTGRES_USER: hotel
      POSTGRES_PASSWORD: hotel
    ports:
      - "${HOTEL_DB_PORT:-5432}:5432"
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - hotel-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hotel -d hotel"]
      interval: 2s
      timeout: 2s
      retries: 30

volumes:
  hotel-data:
